<body><h1>Index Plates Support</h1>
<p>Index Plates divides 40 by the number of divisions on a 40 to 1 spiral head. The remainder is taken on a hole circle the denominator divides. The pin hole counts as zero. A circle that does not divide is not saved.</p>
